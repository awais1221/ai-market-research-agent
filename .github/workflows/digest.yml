name: Weekly digest

on:
  schedule:
    - cron: "0 7 * * 1"        # Mondays at 07:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: "How many days the digest covers"
        default: "7"

permissions:
  contents: write

concurrency:
  group: agent-database
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BASE_URL: ${{ vars.BASE_URL || 'https://generativelanguage.googleapis.com/v1beta/openai/' }}
      MODEL_NAME: ${{ vars.MODEL_NAME || secrets.MODEL_NAME }}
      API_KEY: ${{ secrets.API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: Restore database
        run: bash scripts/ci_db.sh restore
      - name: Build and send the digest
        run: python -m agent digest --days "${{ inputs.days || '7' }}" --send
      - name: Save database
        if: always()
        run: bash scripts/ci_db.sh save
