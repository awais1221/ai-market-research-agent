name: Monitor competitors

on:
  schedule:
    - cron: "0 6 * * *"        # every day at 06:00 UTC
  workflow_dispatch:
    inputs:
      backfill:
        description: "Load 12 months of pricing history first (first run only)"
        type: boolean
        default: false

permissions:
  contents: write              # to save the database on the data branch

concurrency:
  group: agent-database        # never two runs editing the database at once
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BASE_URL: ${{ vars.BASE_URL || 'https://generativelanguage.googleapis.com/v1beta/openai/' }}
      MODEL_NAME: ${{ vars.MODEL_NAME || secrets.MODEL_NAME }}
      API_KEY: ${{ secrets.API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      SOURCES_FROM_SHEET: ${{ vars.SOURCES_FROM_SHEET || 'false' }}
      ALERT_MIN_IMPORTANCE: ${{ vars.ALERT_MIN_IMPORTANCE || 'high' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: Restore database
        run: bash scripts/ci_db.sh restore
      - name: Backfill history
        if: ${{ inputs.backfill }}
        run: python -m agent backfill --months 12
      - name: Check competitors
        run: python -m agent run
      - name: Save database
        if: always()
        run: bash scripts/ci_db.sh save
